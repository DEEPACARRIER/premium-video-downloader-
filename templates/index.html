<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Ultra Downloader Pro | Premium Video Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 🎨 Brand New Color Palette: Deep Space & Electric Indigo */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #060813; color: #f3f4f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .app-wrapper { width: 100%; max-width: 880px; background: #0f1225; border: 1px solid #1f264d; border-radius: 28px; padding: 40px; box-shadow: 0 30px 60px -15px rgba(0,0,0,0.7); }
        
        /* 🔥 THE BANNER IS BACK & BETTER */
        .premium-banner { text-align: center; margin-bottom: 35px; background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(16, 185, 129, 0.1)); padding: 25px; border-radius: 20px; border: 1px solid rgba(99, 102, 241, 0.2); }
        .premium-banner h1 { font-size: 34px; font-weight: 800; background: linear-gradient(to right, #6366f1, #22c55e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
        .premium-banner p { color: #94a3b8; font-size: 14px; margin-top: 6px; font-weight: 500; }
        
        .studio-card { background: #151a36; border: 1px solid #222a57; border-radius: 18px; padding: 24px; margin-bottom: 22px; }
        .card-title { font-size: 13px; font-weight: 700; color: #818cf8; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.08em; }
        
        /* Step 1: Input URL */
        .search-block { display: flex; gap: 12px; }
        input[type="text"] { flex: 1; padding: 16px 20px; background: #0a0d1d; border: 2px solid #2e3973; border-radius: 14px; color: white; font-size: 15px; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); }
        
        .btn-analyze { padding: 16px 32px; background: #6366f1; border: none; border-radius: 14px; color: white; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-analyze:hover { background: #4f46e5; transform: translateY(-1px); }
        .btn-analyze:disabled { background: #334155; cursor: not-allowed; }
        
        /* ✂️ Step 2: Dedicated Video Cutter Layout (ALWAYS SHOWING HERE PERFECTLY) */
        .cutter-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .time-box-field { display: flex; flex-direction: column; gap: 8px; }
        .time-box-field label { font-size: 12px; color: #94a3b8; font-weight: 600; }
        .time-box-field input { padding: 14px; background: #0a0d1d; border: 1px solid #2e3973; border-radius: 10px; color: white; font-size: 14px; text-align: center; font-weight: 700; outline: none; transition: 0.2s; }
        .time-box-field input:focus { border-color: #10b981; }
        
        #status { text-align: center; font-weight: 500; font-size: 14px; margin: 15px 0; color: #94a3b8; }
        
        /* Dynamic Results Grid */
        .results-grid { display: grid; grid-template-columns: 1fr; gap: 30px; border-top: 1px solid #222a57; padding-top: 30px; display: none; }
        @media(min-width: 700px) { .results-grid { grid-template-columns: 260px 1fr; } }
        
        .media-preview-box { display: flex; flex-direction: column; gap: 14px; }
        .video-thumbnail-media { width: 100%; border-radius: 14px; border: 1px solid #222a57; object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        .media-title-text { font-size: 14px; font-weight: 600; color: #f3f4f6; line-height: 1.4; }
        .media-meta-info { font-size: 12px; color: #94a3b8; margin-top: -4px; }
        .btn-save-thumb { padding: 10px; background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; border-radius: 10px; color: #22c55e; font-weight: 600; font-size: 12px; cursor: pointer; text-align: center; transition: 0.2s; }
        .btn-save-thumb:hover { background: #22c55e; color: white; }
        
        /* Live Progress Loader */
        .progress-wrapper-box { background: #0a0d1d; border-radius: 14px; padding: 14px; margin-bottom: 20px; display: none; border: 1px solid #222a57; }
        .progress-track-bg { background: #151a36; height: 10px; border-radius: 6px; overflow: hidden; }
        .progress-fill-bar { height: 100%; background: linear-gradient(to right, #6366f1, #22c55e); width: 0%; transition: width 0.3s; }
        .progress-status-percentage { font-size: 12px; color: #818cf8; text-align: right; margin-top: 6px; font-weight: 700; }
        
        /* Stream Table responsive */
        .table-scroller { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { padding: 14px; background: #0a0d1d; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
        th:first-child { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        th:last-child { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        td { padding: 16px 14px; border-bottom: 1px solid #151a36; font-weight: 500; }
        .badge-premium-res { background: rgba(99, 102, 241, 0.15); color: #818cf8; padding: 4px 10px; border-radius: 6px; font-weight: 700; }
        
        .btn-dl-final { padding: 10px 18px; background: #22c55e; border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; width: 100%; transition: 0.15s; }
        .btn-dl-final:hover { background: #16a34a; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="premium-banner">
        <h1>⚡ Ultra Downloader Pro</h1>
        <p>Premium Studio — Download, Cut, and Convert Video Tracks Automatically</p>
    </div>
    
    <div class="studio-card">
        <div class="card-title">🔗 Step 1: Video Destination URL</div>
        <div class="search-block">
            <input type="text" id="videoUrl" placeholder="Enter or paste video link here (YouTube, FB, Insta, Twitter)...">
            <button id="fetchBtn" class="btn-analyze" onclick="processLink()">Analyze Link</button>
        </div>
    </div>

    <div class="studio-card">
        <div class="card-title">✂️ Step 2: Precise Video Cutter (Optional)</div>
        <div class="cutter-layout">
            <div class="time-box-field">
                <label>Trim Start Timestamp (MM:SS)</label>
                <input type="text" id="startTime" value="00:00" placeholder="00:00">
            </div>
            <div class="time-box-field">
                <label>Trim End Timestamp (MM:SS)</label>
                <input type="text" id="endTime" value="" placeholder="e.g., 03:15 (Leave blank for full video)">
            </div>
        </div>
    </div>
    
    <div id="status"></div>

    <div id="resultBox" class="results-grid">
        <div class="media-preview-box">
            <img id="vThumb" class="video-thumbnail-media" src="" alt="Media Art">
            <div id="vTitle" class="media-title-text"></div>
            <div id="vMeta" class="media-meta-info"></div>
            <button id="thumbDlBtn" class="btn-save-thumb" onclick="downloadThumbnail()">🖼️ Download Media Thumbnail</button>
        </div>
        
        <div style="width: 100%;">
            <div id="progressContainer" class="progress-wrapper-box">
                <div class="progress-track-bg"><div id="progressBar" class="progress-fill-bar"></div></div>
                <div id="progressText" class="progress-status-percentage">0% Transcoding Files...</div>
            </div>

            <div class="table-scroller">
                <table>
                    <thead>
                        <tr>
                            <th>Resolution</th>
                            <th>Encoding</th>
                            <th>Est Size</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="linksTableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
let savedUrl = "";
let currentThumbUrl = "";
let progressInterval = null;

function processLink() {
    const url = document.getElementById('videoUrl').value;
    const status = document.getElementById('status');
    const fetchBtn = document.getElementById('fetchBtn');
    const resultBox = document.getElementById('resultBox');
    
    if(!url) {
        status.innerHTML = "⚠️ Please provide a valid URL endpoint first.";
        status.style.color = "#ef4444";
        return;
    }
    
    savedUrl = url;
    status.innerHTML = "🔍 Fetching content configuration specifications... Please hold on.";
    status.style.color = "#818cf8";
    fetchBtn.disabled = true;
    resultBox.style.display = "none";
    document.getElementById('progressContainer').style.display = "none";
    
    fetch('/get_info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
    })
    .then(res => res.json())
    .then(data => {
        fetchBtn.disabled = false;
        if(data.success) {
            status.innerHTML = "✅ Extraction stream matrix completed successfully!";
            status.style.color = "#22c55e";
            
            currentThumbUrl = data.thumbnail;
            document.getElementById('vThumb').src = data.thumbnail || "https://via.placeholder.com/320x180?text=No+Preview+Available";
            document.getElementById('vTitle').innerHTML = data.title;
            document.getElementById('vMeta').innerHTML = `Duration Frame: ${data.duration}`;
            
            const tbody = document.getElementById('linksTableBody');
            tbody.innerHTML = ""; 
            
            data.formats.forEach(f => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><span class="badge-premium-res">${f.resolution}</span></td>
                    <td style="color: #e2e8f0;">${f.type}</td>
                    <td style="color: #94a3b8;">${f.size}</td>
                    <td>
                        <button class="btn-dl-final" onclick="triggerDownload('${f.id}', this)">
                            📥 Get Link
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            
            resultBox.style.display = "grid";
        } else {
            status.innerHTML = "❌ " + data.message;
            status.style.color = "#ef4444";
        }
    })
    .catch(err => {
        fetchBtn.disabled = false;
        status.innerHTML = "❌ Framework endpoint server error.";
        status.style.color = "#ef4444";
    });
}

function startProgressCheck() {
    const pContainer = document.getElementById('progressContainer');
    const pBar = document.getElementById('progressBar');
    const pText = document.getElementById('progressText');
    
    pContainer.style.display = "block";
    pBar.style.width = "0%";
    pText.innerHTML = "0% Extracting streams...";
    
    progressInterval = setInterval(() => {
        fetch('/get_progress')
        .then(res => res.json())
        .then(data => {
            let p = data.progress;
            pBar.style.width = p + "%";
            pText.innerHTML = p + "% Server processing & merging streams...";
            if(p >= 100) {
                clearInterval(progressInterval);
                pText.innerHTML = "100% Finalizing pipeline output transmission!";
            }
        });
    }, 800); 
}

function triggerDownload(formatId, buttonElement) {
    const status = document.getElementById('status');
    const originalText = buttonElement.innerHTML;
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;
    
    status.innerHTML = "⚡ Initializing high-speed compilation downloads...";
    status.style.color = "#22c55e";
    
    buttonElement.disabled = true;
    buttonElement.innerHTML = "...";
    
    startProgressCheck();
    
    fetch('/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            url: savedUrl, 
            format_id: formatId,
            start_time: startTime,
            end_time: endTime
        })
    })
    .then(response => {
        clearInterval(progressInterval);
        document.getElementById('progressBar').style.width = "100%";
        document.getElementById('progressText').innerHTML = "Completed!";
        if (!response.ok) throw new Error();
        return response.blob();
    })
    .then(blob => {
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = formatId === 'bestaudio' ? "Audio_Track.mp3" : "Premium_Video.mp4";
        document.body.appendChild(a);
        a.click();
        a.remove();
        status.innerHTML = "✅ Asset successfully exported to local environment!";
    })
    .catch(() => {
        clearInterval(progressInterval);
        status.innerHTML = "❌ Pipeline compilation/trimming script aborted.";
        status.style.color = "#ef4444";
    })
    .finally(() => {
        buttonElement.disabled = false;
        buttonElement.innerHTML = originalText;
    });
}

function downloadThumbnail() {
    const btn = document.getElementById('thumbDlBtn');
    if(!currentThumbUrl) return;
    btn.disabled = true;
    btn.innerHTML = "Compiling JPG...";

    fetch('/download_thumb', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ thumb_url: currentThumbUrl })
    })
    .then(res => res.blob())
    .then(blob => {
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = "HD_Thumbnail_Studio.jpg";
        document.body.appendChild(a);
        a.click();
        a.remove();
    })
    .finally(() => {
        btn.disabled = false;
        btn.innerHTML = "🖼️ Download Media Thumbnail";
    });
}
</script>
</body>
</html>

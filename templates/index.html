<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nexus Download Hub | Professional Media Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fc;
            font-family: 'Inter', sans-serif;
            padding: 2rem 1.5rem;
            color: #1e293b;
        }

        /* main container - elegant spacious card */
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* refined header with gradient accent */
        .studio-header {
            padding: 1.8rem 2.5rem 1.2rem;
            border-bottom: 1px solid #eef2f6;
            background: #ffffff;
        }

        .studio-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #1F2B48, #2C3E66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .studio-header h1 i {
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: #2c3e66;
            font-size: 1.7rem;
        }

        .subhead {
            color: #5b6e8c;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            font-weight: 450;
            border-left: 3px solid #cddfe7;
            padding-left: 0.8rem;
        }

        /* card-like sections with subtle rounding */
        .card-pane {
            padding: 1.8rem 2.5rem;
            border-bottom: 1px solid #edf2f7;
            background: #ffffff;
        }

        .card-pane:last-of-type {
            border-bottom: none;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: #5e7a9c;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label i {
            font-size: 0.85rem;
            color: #3b5a8c;
        }

        /* URL row - clean flex */
        .url-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .url-input-wrapper {
            flex: 1;
            min-width: 240px;
        }

        .url-input-wrapper input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 1rem;
            border: 1.5px solid #e2e8f0;
            background: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.2s;
            font-family: 'Inter', monospace;
            color: #0f172a;
        }

        .url-input-wrapper input:focus {
            outline: none;
            border-color: #8aa9c9;
            box-shadow: 0 0 0 3px rgba(74, 108, 147, 0.1);
        }

        .btn-primary {
            background: #1f2f47;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-primary:hover {
            background: #142135;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -8px rgba(31, 47, 71, 0.25);
        }

        /* status zone */
        .status-area {
            background: #f8fafd;
            margin: 0 2.5rem 1rem 2.5rem;
            border-radius: 1rem;
            padding: 0.9rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #2c5f8a;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #8aa9c9;
        }

        /* progress bar subtle */
        .progress-module {
            background: #f4f8fe;
            border-radius: 1rem;
            padding: 1rem;
            margin: 0 2.5rem 1rem 2.5rem;
            display: none;
        }

        .progress-bar-bg {
            background: #e1e9f2;
            border-radius: 30px;
            height: 6px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #2e5a8b;
            border-radius: 30px;
            transition: width 0.2s ease;
        }

        .progress-text {
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 0.5rem;
            text-align: right;
            color: #4b6f96;
        }

        /* RESULT SECTION: modern two column layout */
        .results-panel {
            display: none;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            margin: 0 2.5rem 1.5rem 2.5rem;
        }

        @media (max-width: 720px) {
            .results-panel {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                margin: 0 1.5rem 1.5rem 1.5rem;
            }
            .card-pane {
                padding: 1.5rem;
            }
            .studio-header {
                padding: 1.2rem 1.5rem;
            }
            .status-area, .progress-module {
                margin-left: 1.5rem;
                margin-right: 1.5rem;
            }
        }

        .thumbnail-card {
            background: #fafcff;
            border-radius: 1.25rem;
            overflow: hidden;
            border: 1px solid #eef2f8;
            transition: 0.1s;
        }

        .thumbnail-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: #eef3fa;
        }

        .banner-download-btn {
            background: none;
            border: 1px solid #ccdbe9;
            width: calc(100% - 1.5rem);
            margin: 0.9rem 0.75rem 0.75rem;
            padding: 0.5rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #3e5d82;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .banner-download-btn:hover {
            background: #eef3fc;
            border-color: #9bb7d4;
            color: #1f2f47;
        }

        .media-title {
            font-weight: 700;
            font-size: 0.9rem;
            line-height: 1.4;
            padding: 0.75rem 1rem 0.2rem;
            color: #1e2f44;
        }

        .media-meta {
            font-size: 0.7rem;
            color: #7e92ac;
            padding: 0 1rem 1rem;
            font-weight: 500;
        }

        /* elegant table */
        .format-table-wrapper {
            overflow-x: auto;
            border-radius: 1rem;
        }

        .format-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .format-table th {
            text-align: left;
            padding: 0.9rem 0.5rem 0.7rem 0;
            font-weight: 600;
            color: #5f7f9e;
            border-bottom: 1px solid #eaf0f5;
        }

        .format-table td {
            padding: 0.9rem 0.5rem 0.9rem 0;
            border-bottom: 1px solid #f0f4fa;
            color: #1f3a4f;
            font-weight: 500;
        }

        .res-badge {
            background: #eef3fc;
            padding: 0.25rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #28577e;
            display: inline-block;
        }

        .action-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn-download {
            background: #eef2f9;
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.75rem;
            color: #1e3b5c;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-download i {
            font-size: 0.75rem;
        }

        .btn-download:hover {
            background: #1f2f47;
            color: white;
        }

        /* playlist styling - minimal professional */
        .playlist-section {
            display: none;
            margin: 0 2.5rem 1.5rem 2.5rem;
            background: #fbfdff;
            border-radius: 1.2rem;
            border: 1px solid #edf2f8;
            overflow: hidden;
        }

        .playlist-header {
            padding: 1rem 1.2rem 0.5rem;
            font-weight: 700;
            color: #2e557a;
            border-bottom: 1px solid #eef2f8;
        }

        .playlist-grid {
            max-height: 380px;
            overflow-y: auto;
            background: #ffffff;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid #f0f5fb;
        }

        .playlist-item:last-child {
            border-bottom: none;
        }

        .playlist-title {
            font-weight: 500;
            font-size: 0.85rem;
            color: #253e5c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .playlist-dl-btn {
            background: #eaf1fa;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 1.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2f5e8c;
            cursor: pointer;
            transition: 0.15s;
        }

        .playlist-dl-btn:hover {
            background: #d4e2f2;
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
        
        .info-note {
            font-size: 0.7rem;
            color: #8ba0bc;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="studio-header">
        <!-- Header load hoga yahan -->
<div id="platforms-header-placeholder"></div>

<script>
    // Load header.html dynamically
    fetch('/static/header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('platforms-header-placeholder').innerHTML = data;
        })
        .catch(error => {
            console.log('Header load failed:', error);
        });
</script>
        <h1><i class="fas fa-cloud-download-alt"></i> Nexus Download Hub</h1>
        <div class="subhead">Professional media suite · YouTube · Instagram · Facebook · Playlists · High-speed downloads</div>
    </div>

    <div class="card-pane">
        <div class="section-label"><i class="fas fa-link"></i> SOURCE URL</div>
        <div class="url-row">
            <div class="url-input-wrapper">
                <input type="text" id="sourceUrl" placeholder="Paste video, reel, or playlist link ..." autocomplete="off">
            </div>
            <button id="analyzeBtn" class="btn-primary"><i class="fas fa-waveform"></i> Analyze</button>
        </div>
        <div class="info-note"><i class="fas fa-download"></i> Full original quality · Direct downloads only</div>
    </div>

    <div id="statusMessage" class="status-area">
        <i class="fas fa-info-circle"></i> <span id="statusText">Ready — paste link and analyze</span>
    </div>

    <!-- Progress container (only for download feedback) -->
    <div id="progressArea" class="progress-module">
        <div class="progress-bar-bg"><div id="progressFill" class="progress-fill"></div></div>
        <div id="progressMsg" class="progress-text">0%</div>
    </div>

    <!-- Main results section: thumbnail + formats table -->
    <div id="resultsContainer" class="results-panel">
        <div class="thumbnail-card">
            <img id="thumbImg" class="thumbnail-img" src="https://placehold.co/400x225?text=Preview" alt="thumbnail">
            <button id="bannerDownloadBtn" class="banner-download-btn"><i class="fas fa-image"></i> Download artwork</button>
            <div id="mediaTitleDisplay" class="media-title">—</div>
            <div id="mediaMetaDisplay" class="media-meta">—</div>
        </div>
        <div>
            <div class="format-table-wrapper">
                <table class="format-table">
                    <thead>
                        <tr><th>Quality</th><th>Approx. size</th><th>Action</th></tr>
                    </thead>
                    <tbody id="formatsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Playlist block -->
    <div id="playlistBlock" class="playlist-section">
        <div class="playlist-header" id="playlistTitleBlock"></div>
        <div id="playlistItemsContainer" class="playlist-grid"></div>
    </div>
</div>

<script>
    // --------------------- STATE ---------------------------------
    let currentUrl = "";
    let currentThumbnail = "";
    let currentMediaTitle = "";
    let formatsList = [];
    let isPlaylistMode = false;
    let progressInterval = null;
    let activeFetch = false;

    // DOM elements
    const sourceInput = document.getElementById('sourceUrl');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const statusSpan = document.getElementById('statusText');
    const resultsDiv = document.getElementById('resultsContainer');
    const playlistDiv = document.getElementById('playlistBlock');
    const progressContainer = document.getElementById('progressArea');
    const progressFill = document.getElementById('progressFill');
    const progressMsgSpan = document.getElementById('progressMsg');
    const thumbImg = document.getElementById('thumbImg');
    const mediaTitleSpan = document.getElementById('mediaTitleDisplay');
    const mediaMetaSpan = document.getElementById('mediaMetaDisplay');
    const bannerBtn = document.getElementById('bannerDownloadBtn');
    const formatsBody = document.getElementById('formatsTableBody');

    function resetUIForNewFetch() {
        if (progressInterval) clearInterval(progressInterval);
        progressContainer.style.display = "none";
        resultsDiv.style.display = "none";
        playlistDiv.style.display = "none";
        formatsBody.innerHTML = "";
        isPlaylistMode = false;
        statusSpan.innerText = "Processing request...";
        document.getElementById('statusMessage').style.borderLeftColor = "#ffb347";
        statusSpan.style.color = "#2c5f8a";
    }

    function showError(msg) {
        statusSpan.innerText = msg;
        document.getElementById('statusMessage').style.borderLeftColor = "#e25c5c";
        statusSpan.style.color = "#c24141";
        analyzeBtn.disabled = false;
        activeFetch = false;
    }

    function showSuccess(msg) {
        statusSpan.innerText = msg;
        document.getElementById('statusMessage').style.borderLeftColor = "#7fa9c4";
        statusSpan.style.color = "#2c5f8a";
    }

    function startProgressTracking() {
        if (progressInterval) clearInterval(progressInterval);
        progressContainer.style.display = "block";
        progressFill.style.width = "0%";
        progressMsgSpan.innerText = "0% preparing...";
        progressInterval = setInterval(() => {
            fetch('/get_progress')
                .then(res => res.json())
                .then(data => {
                    let prog = data.progress || 0;
                    if (prog > 100) prog = 100;
                    progressFill.style.width = prog + "%";
                    progressMsgSpan.innerText = prog + "% · processing";
                    if (prog >= 100) {
                        clearInterval(progressInterval);
                        progressMsgSpan.innerText = "Complete!";
                    }
                })
                .catch(() => {});
        }, 900);
    }

    function stopProgressTracking() {
        if (progressInterval) {
            clearInterval(progressInterval);
            progressInterval = null;
        }
        progressFill.style.width = "100%";
        progressMsgSpan.innerText = "Finalized";
        setTimeout(() => {
            if(progressContainer) progressContainer.style.display = "none";
        }, 1200);
    }

    // PURE DOWNLOAD FUNCTION - NO DRIVE, NO TRIMMING
    function triggerDownload(formatId, btnElement) {
        if (!currentUrl) return;
        btnElement.disabled = true;
        showSuccess("Initiating secure download...");
        startProgressTracking();

        fetch('/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: currentUrl, format_id: formatId })
        })
        .then(response => {
            if (!response.ok) throw new Error("download failed");
            return response.blob();
        })
        .then(blob => {
            const dlUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = dlUrl;
            a.download = formatId.includes('audio') ? "audio_track.mp3" : "nexus_media.mp4";
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(dlUrl);
            stopProgressTracking();
            showSuccess("Download completed ✓");
            btnElement.disabled = false;
        })
        .catch(err => {
            console.warn(err);
            stopProgressTracking();
            showError("Download error: server issue");
            btnElement.disabled = false;
        });
    }

    function renderFormats(formats) {
        formatsBody.innerHTML = "";
        if (!formats || !formats.length) {
            const row = document.createElement('tr');
            row.innerHTML = `<td colspan="3" style="padding:1rem; text-align:center;">No downloadable formats available</td>`;
            formatsBody.appendChild(row);
            return;
        }
        formats.forEach(f => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="res-badge">${f.resolution || f.quality || "Standard"}</span></td>
                <td style="font-size:0.8rem;">${f.size || "~ varies"}</td>
                <td class="action-group">
                    <button class="btn-download" data-fid="${f.id}"><i class="fas fa-download"></i> Download</button>
                </td>
            `;
            formatsBody.appendChild(tr);
        });
        // attach download events only
        document.querySelectorAll('.btn-download').forEach(btn => {
            const fid = btn.getAttribute('data-fid');
            btn.addEventListener('click', (e) => triggerDownload(fid, btn));
        });
    }

    function displayPlaylist(playlistData) {
        const container = document.getElementById('playlistItemsContainer');
        const titleBlock = document.getElementById('playlistTitleBlock');
        titleBlock.innerHTML = `<i class="fas fa-list-ul"></i> Playlist: ${playlistData.playlist_title || "Media Collection"} (${playlistData.videos.length} items) · Click any to load`;
        container.innerHTML = "";
        playlistData.videos.forEach(video => {
            const itemDiv = document.createElement('div');
            itemDiv.className = "playlist-item";
            itemDiv.innerHTML = `
                <div class="playlist-title" title="${video.title}">${video.title.substring(0, 70)}</div>
                <button class="playlist-dl-btn" data-url="${video.url}"><i class="fas fa-video"></i> Select</button>
            `;
            container.appendChild(itemDiv);
        });
        document.querySelectorAll('.playlist-dl-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const videoUrl = btn.getAttribute('data-url');
                sourceInput.value = videoUrl;
                processLinkRequest();
            });
        });
        playlistDiv.style.display = "block";
        resultsDiv.style.display = "none";
    }

    function handleSingleVideo(data) {
        currentThumbnail = data.thumbnail;
        currentMediaTitle = data.title;
        thumbImg.src = data.thumbnail || "https://placehold.co/400x225?text=No+preview";
        mediaTitleSpan.innerText = data.title.length > 70 ? data.title.slice(0,70)+"..." : data.title;
        mediaMetaSpan.innerText = `⏱️ ${data.duration || "unknown duration"} · ${data.formats?.length || 0} formats available`;
        formatsList = data.formats || [];
        renderFormats(formatsList);
        resultsDiv.style.display = "grid";
        playlistDiv.style.display = "none";
        
        // banner artwork download (kept as useful feature)
        bannerBtn.onclick = () => {
            if (currentThumbnail) {
                fetch(currentThumbnail)
                    .then(r => r.blob())
                    .then(blob => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = "thumbnail_art.jpg";
                        a.click();
                        URL.revokeObjectURL(url);
                        showSuccess("Artwork downloaded");
                    })
                    .catch(() => {
                        const a = document.createElement('a');
                        a.href = currentThumbnail;
                        a.download = "thumbnail_fallback.jpg";
                        a.target = "_blank";
                        a.click();
                        showSuccess("Artwork opened");
                    });
            } else showError("No artwork available");
        };
    }

    async function processLinkRequest() {
        const url = sourceInput.value.trim();
        if (!url) {
            showError("Please enter a valid URL");
            return;
        }
        if (activeFetch) return;
        activeFetch = true;
        analyzeBtn.disabled = true;
        resetUIForNewFetch();
        currentUrl = url;

        try {
            const response = await fetch('/get_info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            const data = await response.json();
            if (!data.success) {
                showError(data.message || "Failed to extract metadata");
                analyzeBtn.disabled = false;
                activeFetch = false;
                return;
            }
            if (data.is_playlist) {
                isPlaylistMode = true;
                displayPlaylist(data);
                showSuccess(`Playlist loaded: ${data.videos.length} items`);
            } else {
                isPlaylistMode = false;
                handleSingleVideo(data);
                showSuccess("Media ready · click Download button");
            }
        } catch (err) {
            showError("Network error: " + (err.message || "server unreachable"));
        } finally {
            analyzeBtn.disabled = false;
            activeFetch = false;
        }
    }

    // event binding
    analyzeBtn.addEventListener('click', processLinkRequest);
    sourceInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') processLinkRequest(); });
    
    showSuccess("Ready — paste link and analyze (timer & drive removed)");
</script>
</body>
</html>

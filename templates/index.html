<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Nexus Download Hub | Professional Media Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fc;
            font-family: 'Inter', sans-serif;
            padding: 2rem 1.5rem;
            color: #1e293b;
        }

        /* main container - elegant spacious card */
        .app-container {
            max-width: 1280px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.02);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        /* refined header with gradient accent */
        .studio-header {
            padding: 1.8rem 2.5rem 1.2rem;
            border-bottom: 1px solid #eef2f6;
            background: #ffffff;
        }

        .studio-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #1F2B48, #2C3E66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .studio-header h1 i {
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            color: #2c3e66;
            font-size: 1.7rem;
        }

        .subhead {
            color: #5b6e8c;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            font-weight: 450;
            border-left: 3px solid #cddfe7;
            padding-left: 0.8rem;
        }

        /* card-like sections with subtle rounding */
        .card-pane {
            padding: 1.8rem 2.5rem;
            border-bottom: 1px solid #edf2f7;
            background: #ffffff;
        }

        .card-pane:last-of-type {
            border-bottom: none;
        }

        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: #5e7a9c;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label i {
            font-size: 0.85rem;
            color: #3b5a8c;
        }

        /* URL row - clean flex */
        .url-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        .url-input-wrapper {
            flex: 1;
            min-width: 240px;
        }

        .url-input-wrapper input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            border-radius: 1rem;
            border: 1.5px solid #e2e8f0;
            background: #ffffff;
            font-size: 0.95rem;
            font-weight: 500;
            transition: 0.2s;
            font-family: 'Inter', monospace;
            color: #0f172a;
        }

        .url-input-wrapper input:focus {
            outline: none;
            border-color: #8aa9c9;
            box-shadow: 0 0 0 3px rgba(74, 108, 147, 0.1);
        }

        .btn-primary {
            background: #1f2f47;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 1rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .btn-primary:hover {
            background: #142135;
            transform: translateY(-1px);
            box-shadow: 0 10px 20px -8px rgba(31, 47, 71, 0.25);
        }

        /* status zone */
        .status-area {
            background: #f8fafd;
            margin: 0 2.5rem 1rem 2.5rem;
            border-radius: 1rem;
            padding: 0.9rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #2c5f8a;
            display: flex;
            align-items: center;
            gap: 10px;
            border-left: 4px solid #8aa9c9;
        }

        /* cutter card (refined) */
        .cutter-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            background: #fbfdff;
            border-radius: 1.25rem;
            padding: 0.2rem 0;
        }

        .time-field {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .time-field label {
            font-size: 0.7rem;
            font-weight: 700;
            color: #6b7f9b;
            text-transform: uppercase;
        }

        .time-field input {
            background: #ffffff;
            border: 1px solid #e2edf2;
            padding: 0.7rem 1rem;
            border-radius: 0.9rem;
            font-weight: 500;
            font-size: 0.85rem;
            width: 140px;
            font-family: monospace;
        }

        /* RESULT SECTION: modern two column layout */
        .results-panel {
            display: none;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
            margin-top: 0.8rem;
        }

        @media (max-width: 720px) {
            .results-panel {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .card-pane {
                padding: 1.5rem;
            }
            .studio-header {
                padding: 1.2rem 1.5rem;
            }
        }

        .thumbnail-card {
            background: #fafcff;
            border-radius: 1.25rem;
            overflow: hidden;
            border: 1px solid #eef2f8;
            transition: 0.1s;
        }

        .thumbnail-img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            display: block;
            background: #eef3fa;
        }

        .banner-download-btn {
            background: none;
            border: 1px solid #ccdbe9;
            width: calc(100% - 1.5rem);
            margin: 0.9rem 0.75rem 0.75rem;
            padding: 0.5rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: #3e5d82;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .banner-download-btn:hover {
            background: #eef3fc;
            border-color: #9bb7d4;
            color: #1f2f47;
        }

        .media-title {
            font-weight: 700;
            font-size: 0.9rem;
            line-height: 1.4;
            padding: 0.75rem 1rem 0.2rem;
            color: #1e2f44;
        }

        .media-meta {
            font-size: 0.7rem;
            color: #7e92ac;
            padding: 0 1rem 1rem;
            font-weight: 500;
        }

        /* progress bar subtle */
        .progress-module {
            background: #f4f8fe;
            border-radius: 1rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: none;
        }

        .progress-bar-bg {
            background: #e1e9f2;
            border-radius: 30px;
            height: 6px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #2e5a8b;
            border-radius: 30px;
            transition: width 0.2s ease;
        }

        .progress-text {
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 0.5rem;
            text-align: right;
            color: #4b6f96;
        }

        /* elegant table */
        .format-table-wrapper {
            overflow-x: auto;
            border-radius: 1rem;
        }

        .format-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .format-table th {
            text-align: left;
            padding: 0.9rem 0.5rem 0.7rem 0;
            font-weight: 600;
            color: #5f7f9e;
            border-bottom: 1px solid #eaf0f5;
        }

        .format-table td {
            padding: 0.9rem 0.5rem 0.9rem 0;
            border-bottom: 1px solid #f0f4fa;
            color: #1f3a4f;
            font-weight: 500;
        }

        .res-badge {
            background: #eef3fc;
            padding: 0.25rem 0.7rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #28577e;
            display: inline-block;
        }

        .action-group {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .btn-download {
            background: #eef2f9;
            border: none;
            padding: 0.45rem 1rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.7rem;
            color: #1e3b5c;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-download i {
            font-size: 0.7rem;
        }

        .btn-download:hover {
            background: #1f2f47;
            color: white;
        }

        .btn-drive {
            background: #fef7e0;
            border: none;
            padding: 0.45rem 0.9rem;
            border-radius: 2rem;
            font-weight: 600;
            font-size: 0.7rem;
            color: #b26b00;
            cursor: pointer;
        }

        .btn-drive:hover {
            background: #ffecb3;
        }

        /* playlist styling - minimal professional */
        .playlist-section {
            display: none;
            margin-top: 0.5rem;
            background: #fbfdff;
            border-radius: 1.2rem;
        }

        .playlist-header {
            padding: 0.5rem 0 1rem;
            font-weight: 700;
            color: #2e557a;
        }

        .playlist-grid {
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #ecf3f9;
            border-radius: 1rem;
            background: #ffffff;
        }

        .playlist-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.9rem 1rem;
            border-bottom: 1px solid #f0f5fb;
        }

        .playlist-item:last-child {
            border-bottom: none;
        }

        .playlist-title {
            font-weight: 500;
            font-size: 0.85rem;
            color: #253e5c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .playlist-dl-btn {
            background: #eaf1fa;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 1.5rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: #2f5e8c;
            cursor: pointer;
        }

        hr {
            margin: 0;
            border-color: #eef2f8;
        }

        i, .fas, .far {
            pointer-events: none;
        }
        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<div class="app-container">
    <div class="studio-header">
        <h1><i class="fas fa-cloud-download-alt"></i> Nexus Download Hub</h1>
        <div class="subhead">Professional media suite · YouTube · Instagram · Facebook · Playlists · Smart trimming</div>
    </div>

    <div class="card-pane">
        <div class="section-label"><i class="fas fa-link"></i> SOURCE URL</div>
        <div class="url-row">
            <div class="url-input-wrapper">
                <input type="text" id="sourceUrl" placeholder="Paste video, reel, or playlist link ..." autocomplete="off">
            </div>
            <button id="analyzeBtn" class="btn-primary"><i class="fas fa-waveform"></i> Analyze</button>
        </div>
    </div>

    <div id="statusMessage" class="status-area">
        <i class="fas fa-info-circle"></i> <span id="statusText">Ready — paste link and analyze</span>
    </div>

    <!-- Optional cutter card (hidden initially) -->
    <div id="cutterSection" class="card-pane" style="display: none;">
        <div class="section-label"><i class="fas fa-cut"></i> PRECISION CUT (optional)</div>
        <div class="cutter-grid">
            <div class="time-field">
                <label>Start (MM:SS or seconds)</label>
                <input type="text" id="startCut" placeholder="00:00" value="00:00">
            </div>
            <div class="time-field">
                <label>End (MM:SS)</label>
                <input type="text" id="endCut" placeholder="e.g., 01:30">
            </div>
        </div>
    </div>

    <!-- Progress container -->
    <div id="progressArea" class="progress-module">
        <div class="progress-bar-bg"><div id="progressFill" class="progress-fill"></div></div>
        <div id="progressMsg" class="progress-text">0%</div>
    </div>

    <!-- Main results section: thumbnail + formats table -->
    <div id="resultsContainer" class="card-pane results-panel">
        <div class="thumbnail-card">
            <img id="thumbImg" class="thumbnail-img" src="https://placehold.co/400x225?text=Preview" alt="thumbnail">
            <button id="bannerDownloadBtn" class="banner-download-btn"><i class="fas fa-image"></i> Download artwork</button>
            <div id="mediaTitleDisplay" class="media-title">—</div>
            <div id="mediaMetaDisplay" class="media-meta">—</div>
        </div>
        <div>
            <div class="format-table-wrapper">
                <table class="format-table">
                    <thead>
                        <tr><th>Quality</th><th>Approx. size</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="formatsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Playlist block -->
    <div id="playlistBlock" class="card-pane playlist-section">
        <div class="playlist-header" id="playlistTitleBlock"></div>
        <div id="playlistItemsContainer" class="playlist-grid"></div>
    </div>
</div>

<script>
    // --------------------- STATE ---------------------------------
    // --------------------- STATE ---------------------------------
let currentUrl = "";
let currentThumbnail = "";
let currentMediaTitle = "";
let formatsList = [];
let isPlaylistMode = false;
let progressInterval = null;
let activeFetch = false;

// DOM elements
const sourceInput = document.getElementById('sourceUrl');
const analyzeBtn = document.getElementById('analyzeBtn');
const statusSpan = document.getElementById('statusText');
const cutterDiv = document.getElementById('cutterSection');
const resultsDiv = document.getElementById('resultsContainer');
const playlistDiv = document.getElementById('playlistBlock');
const progressContainer = document.getElementById('progressArea');
const progressFill = document.getElementById('progressFill');
const progressMsgSpan = document.getElementById('progressMsg');
const thumbImg = document.getElementById('thumbImg');
const mediaTitleSpan = document.getElementById('mediaTitleDisplay');
const mediaMetaSpan = document.getElementById('mediaMetaDisplay');
const bannerBtn = document.getElementById('bannerDownloadBtn');
const formatsBody = document.getElementById('formatsTableBody');

// --- HELPER FUNCTIONS ---
function resetUIForNewFetch() {
    if (progressInterval) clearInterval(progressInterval);
    progressContainer.style.display = "none";
    resultsDiv.style.display = "none";
    playlistDiv.style.display = "none";
    cutterDiv.style.display = "none";
    formatsBody.innerHTML = "";
    isPlaylistMode = false;
    statusSpan.innerText = "Processing request...";
    document.getElementById('statusMessage').style.borderLeftColor = "#ffb347";
}

function showError(msg) {
    statusSpan.innerText = msg;
    document.getElementById('statusMessage').style.borderLeftColor = "#e25c5c";
    statusSpan.style.color = "#c24141";
    analyzeBtn.disabled = false;
    activeFetch = false;
}

function showSuccess(msg) {
    statusSpan.innerText = msg;
    document.getElementById('statusMessage').style.borderLeftColor = "#7fa9c4";
    statusSpan.style.color = "#2c5f8a";
}

// --- PROGRESS TRACKING ---
function startProgressTracking() {
    if (progressInterval) clearInterval(progressInterval);
    progressContainer.style.display = "block";
    progressFill.style.width = "0%";
    progressMsgSpan.innerText = "0% preparing...";
    progressInterval = setInterval(() => {
        fetch('/get_progress')
            .then(res => res.json())
            .then(data => {
                let prog = data.progress || 0;
                if (prog > 100) prog = 100;
                progressFill.style.width = prog + "%";
                progressMsgSpan.innerText = prog + "% · transcoding...";
                if (prog >= 100) {
                    clearInterval(progressInterval);
                    progressMsgSpan.innerText = "Complete!";
                }
            }).catch(() => {});
    }, 900);
}

function stopProgressTracking() {
    if (progressInterval) clearInterval(progressInterval);
    progressFill.style.width = "100%";
    progressMsgSpan.innerText = "Finalized";
    setTimeout(() => { progressContainer.style.display = "none"; }, 1200);
}

// --- DOWNLOAD & DRIVE LOGIC ---
async function triggerDownload(formatId, btnElement) {
    if (!currentUrl) return;
    const startVal = document.getElementById('startCut').value.trim() || "00:00";
    const endVal = document.getElementById('endCut').value.trim();
    
    btnElement.disabled = true;
    showSuccess("Initiating download...");
    startProgressTracking();

    try {
        const response = await fetch('/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: currentUrl, format_id: formatId, start_time: startVal, end_time: endVal })
        });
        if (!response.ok) throw new Error("Server error");
        const blob = await response.blob();
        const dlUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = dlUrl;
        a.download = `${currentMediaTitle}.mp4`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(dlUrl);
        stopProgressTracking();
        showSuccess("Download completed!");
    } catch (err) {
        stopProgressTracking();
        showError("Download failed");
    } finally {
        btnElement.disabled = false;
    }
}

async function saveToDrive(formatId, btnElement) {
    if (!currentUrl) return;
    btnElement.disabled = true;
    showSuccess("Uploading to Drive...");
    startProgressTracking();

    try {
        const res = await fetch('/upload_drive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: currentUrl, format_id: formatId })
        });
        const data = await res.json();
        stopProgressTracking();
        if (data.success) showSuccess("Uploaded to Drive!");
        else showError("Drive failed: " + data.message);
    } catch {
        stopProgressTracking();
        showError("Drive upload failed");
    } finally {
        btnElement.disabled = false;
    }
}

// --- RENDER & DISPLAY ---
function renderFormats(formats) {
    formatsBody.innerHTML = "";
    formats.forEach(f => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><span class="res-badge">${f.resolution || "SD"}</span></td>
            <td>${f.size || "N/A"}</td>
            <td class="action-group">
                <button class="btn-download" onclick="triggerDownload('${f.id}', this)">Download</button>
                <button class="btn-drive" onclick="saveToDrive('${f.id}', this)">Drive</button>
            </td>
        `;
        formatsBody.appendChild(tr);
    });
}

function displayPlaylist(playlistData) {
    const container = document.getElementById('playlistItemsContainer');
    document.getElementById('playlistTitleBlock').innerText = `Playlist: ${playlistData.playlist_title}`;
    container.innerHTML = "";
    playlistData.videos.forEach(video => {
        const div = document.createElement('div');
        div.className = "playlist-item";
        div.innerHTML = `<span>${video.title}</span><button onclick="sourceInput.value='${video.url}'; processLinkRequest();">Pull</button>`;
        container.appendChild(div);
    });
    playlistDiv.style.display = "block";
}

function handleSingleVideo(data) {
    currentThumbnail = data.thumbnail;
    currentMediaTitle = data.title;
    thumbImg.src = data.thumbnail;
    mediaTitleSpan.innerText = data.title;
    renderFormats(data.formats);
    resultsDiv.style.display = "grid";
    cutterDiv.style.display = "block";
}

async function processLinkRequest() {
    const url = sourceInput.value.trim();
    if (!url) return showError("Please enter a URL");
    if (activeFetch) return;
    
    activeFetch = true;
    analyzeBtn.disabled = true;
    resetUIForNewFetch();
    currentUrl = url;

    try {
        const res = await fetch('/get_info', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({url: url})
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message);
        
        if (data.is_playlist) displayPlaylist(data);
        else handleSingleVideo(data);
        showSuccess("Ready!");
    } catch (err) {
        showError(err.message);
    } finally {
        analyzeBtn.disabled = false;
        activeFetch = false;
    }
}

analyzeBtn.addEventListener('click', processLinkRequest);
    sourceInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') processLinkRequest(); });
    
    // initial placeholder
    showSuccess("Ready — paste link and click Analyze");
</script>
</body>
</html>

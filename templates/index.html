<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ NextGen Multi-Downloader Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* 🎨 NEW THEME: Cyberpunk Glassmorphism UI */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }
        body { background: #03000a; background-image: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.12) 0%, transparent 40%); color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .app-wrapper { width: 100%; max-width: 900px; background: rgba(13, 10, 28, 0.75); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 32px; padding: 45px; box-shadow: 0 40px 100px -20px rgba(0,0,0,0.8); }
        
        /* ⚡ GLOWING ULTRA BANNER */
        .premium-banner { text-align: center; margin-bottom: 40px; padding: 30px; background: rgba(255, 255, 255, 0.02); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.04); position: relative; overflow: hidden; }
        .premium-banner h1 { font-size: 38px; font-weight: 800; background: linear-gradient(90deg, #818cf8, #ec4899, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -1px; }
        .premium-banner p { color: #94a3b8; font-size: 15px; margin-top: 8px; font-weight: 500; }
        
        .studio-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 20px; padding: 26px; margin-bottom: 24px; transition: 0.3s ease; }
        .studio-card:hover { border-color: rgba(129, 140, 248, 0.3); }
        .card-title { font-size: 12px; font-weight: 700; color: #a5b4fc; margin-bottom: 18px; text-transform: uppercase; letter-spacing: 0.12em; display: flex; align-items: center; gap: 8px; }
        
        /* Input & Core Fields */
        .search-block { display: flex; gap: 14px; }
        input[type="text"] { flex: 1; padding: 18px 24px; background: #090614; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; color: white; font-size: 15px; outline: none; transition: 0.2s; }
        input[type="text"]:focus { border-color: #818cf8; box-shadow: 0 0 20px rgba(129, 140, 248, 0.2); }
        
        .btn-analyze { padding: 18px 36px; background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; border-radius: 16px; color: white; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); }
        .btn-analyze:hover { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.6); }
        
        /* ✂️ TIMER CONTROL (HIDDEN BY DEFAULT WHEN DYNAMIC LOAD IS IDLE) */
        #cutterCard { display: none; border-left: 4px solid #ec4899; }
        .cutter-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .time-box-field { display: flex; flex-direction: column; gap: 8px; }
        .time-box-field label { font-size: 12px; color: #94a3b8; font-weight: 600; }
        .time-box-field input { padding: 14px; background: #090614; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; font-size: 15px; text-align: center; font-weight: 700; outline: none; }
        .time-box-field input:focus { border-color: #ec4899; }
        
        #status { text-align: center; font-weight: 600; font-size: 14px; margin: 20px 0; color: #94a3b8; }
        
        /* Dynamic Matrix Grid */
        .results-grid { display: grid; grid-template-columns: 1fr; gap: 35px; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 35px; display: none; }
        @media(min-width: 720px) { .results-grid { grid-template-columns: 280px 1fr; } }
        
        .media-preview-box { display: flex; flex-direction: column; gap: 16px; }
        .video-thumbnail-media { width: 100%; border-radius: 18px; border: 1px solid rgba(255, 255, 255, 0.1); object-fit: cover; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .media-title-text { font-size: 15px; font-weight: 600; color: #f1f5f9; line-height: 1.5; }
        
        /* Live Realtime Loader */
        .progress-wrapper-box { background: #090614; border-radius: 16px; padding: 16px; margin-bottom: 25px; display: none; border: 1px solid rgba(255, 255, 255, 0.05); }
        .progress-track-bg { background: rgba(255,255,255,0.05); height: 8px; border-radius: 10px; overflow: hidden; }
        .progress-fill-bar { height: 100%; background: linear-gradient(90deg, #818cf8, #ec4899); width: 0%; transition: width 0.2s; }
        .progress-status-percentage { font-size: 12px; color: #a5b4fc; text-align: right; margin-top: 8px; font-weight: 700; }
        
        /* Matrix Data Sheets */
        .table-scroller { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 16px; background: #090614; color: #64748b; font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
        td { padding: 18px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.03); font-size: 14px; font-weight: 500; }
        .badge-premium-res { background: rgba(129, 140, 248, 0.12); color: #c7d2fe; padding: 6px 12px; border-radius: 8px; font-weight: 700; border: 1px solid rgba(129, 140, 248, 0.2); }
        
        .action-cell { display: flex; gap: 8px; }
        .btn-dl-final { padding: 12px 20px; background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; flex: 1; transition: 0.2s; }
        .btn-dl-final:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); }
        .btn-gdrive { padding: 12px 14px; background: rgba(250, 204, 21, 0.1); border: 1px solid #facc15; border-radius: 12px; color: #facc15; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; transition: 0.2s; }
        .btn-gdrive:hover { background: #facc15; color: #000; }

        /* 📜 AUTO PLAYLIST MODULE LAYOUT */
        #playlistBox { display: none; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 35px; }
        .playlist-wrapper-grid { display: flex; flex-direction: column; gap: 12px; max-height: 400px; overflow-y: auto; padding-right: 8px; }
        .playlist-item { background: rgba(255, 255, 255, 0.02); padding: 16px 20px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255, 255, 255, 0.05); transition: 0.2s; }
        .playlist-item:hover { background: rgba(255, 255, 255, 0.04); border-color: rgba(236, 72, 153, 0.2); }
        .p-title { font-size: 14px; color: #e2e8f0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 75%; }
        .btn-p-dl { padding: 10px 18px; background: linear-gradient(135deg, #ec4899, #db2777); border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; font-size: 12px; transition: 0.2s; }
        .btn-p-dl:hover { transform: scale(1.03); }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="premium-banner">
        <h1>⚡ Ultra Downloader Pro</h1>
        <p>Studio Matrix — Universal Engine for YouTube, Instagram, Facebook & Playlists</p>
    </div>
    
    <div class="studio-card">
        <div class="card-title">🔗 Step 1: Input Stream Destination URL</div>
        <div class="search-block">
            <input type="text" id="videoUrl" placeholder="Paste Video Link or YouTube Playlist Endpoint here...">
            <button id="fetchBtn" class="btn-analyze" onclick="processLink()">Analyze Stream</button>
        </div>
    </div>

    <div class="studio-card" id="cutterCard">
        <div class="card-title">✂️ Step 2: Precision Video Cutter / Range Compiler (Optional)</div>
        <div class="cutter-layout">
            <div class="time-box-field">
                <label>Trim Start Timestamp (MM:SS)</label>
                <input type="text" id="startTime" value="00:00" placeholder="00:00">
            </div>
            <div class="time-box-field">
                <label>Trim End Timestamp (MM:SS)</label>
                <input type="text" id="endTime" value="" placeholder="e.g., 02:45 (Leave blank for full stream)">
            </div>
        </div>
    </div>
    
    <div id="status"></div>

    <div id="resultBox" class="results-grid">
        <div class="media-preview-box">
            <img id="vThumb" class="video-thumbnail-media" src="" alt="Thumbnail Art">
            <div id="vTitle" class="media-title-text"></div>
            <div id="vMeta" style="font-size: 12px; color: #64748b; font-weight: 600; margin-top: -6px;"></div>
        </div>
        
        <div style="width: 100%;">
            <div id="progressContainer" class="progress-wrapper-box">
                <div class="progress-track-bg"><div id="progressBar" class="progress-fill-bar"></div></div>
                <div id="progressText" class="progress-status-percentage">0% Transcoding Files...</div>
            </div>

            <div class="table-scroller">
                <table>
                    <thead>
                        <tr>
                            <th>Resolution</th>
                            <th>Est Size</th>
                            <th>Action Matrix</th>
                        </tr>
                    </thead>
                    <tbody id="linksTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="playlistBox">
        <div class="card-title" id="playlistMainTitle" style="color: #34d399; font-size: 15px; margin-bottom: 20px;">📋 Playlist Array Matrix</div>
        <div id="playlistContainer" class="playlist-wrapper-grid"></div>
    </div>
</div>

<script>
let savedUrl = "";
let progressInterval = null;

function processLink() {
    const url = document.getElementById('videoUrl').value;
    const status = document.getElementById('status');
    const fetchBtn = document.getElementById('fetchBtn');
    const resultBox = document.getElementById('resultBox');
    const playlistBox = document.getElementById('playlistBox');
    const cutterCard = document.getElementById('cutterCard');
    
    if(!url) {
        status.innerHTML = "⚠️ Please provide a valid link first.";
        status.style.color = "#f43f5e";
        return;
    }
    
    savedUrl = url;
    status.innerHTML = "🔍 Compiling global extraction nodes... Please wait.";
    status.style.color = "#6366f1";
    fetchBtn.disabled = true;
    
    // Smooth reset states
    resultBox.style.display = "none";
    playlistBox.style.display = "none";
    cutterCard.style.display = "none";
    document.getElementById('progressContainer').style.display = "none";
    
    fetch('/get_info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
    })
    .then(res => res.json())
    .then(data => {
        fetchBtn.disabled = false;
        if(data.success) {
            status.innerHTML = "✅ Extraction stream completed!";
            status.style.color = "#10b981";
            
            if(data.is_playlist) {
                // Render Playlists
                document.getElementById('playlistMainTitle').innerText = `📋 Playlist: ${data.playlist_title} (${data.videos.length} Tracks Detected)`;
                const pContainer = document.getElementById('playlistContainer');
                pContainer.innerHTML = "";
                
                data.videos.forEach(v => {
                    const block = document.createElement('div');
                    block.className = "playlist-item";
                    block.innerHTML = `
                        <div class="p-title">${v.title}</div>
                        <button class="btn-p-dl" onclick="processSingleTrackDirectly('${v.url}')">📥 Pull Video</button>
                    `;
                    pContainer.appendChild(block);
                });
                playlistBox.style.display = "block";
            } else {
                // ✂️ Dynamic Load: Show Timer Control Card ONLY on single video success
                cutterCard.style.display = "block";
                
                document.getElementById('vThumb').src = data.thumbnail;
                document.getElementById('vTitle').innerHTML = data.title;
                document.getElementById('vMeta').innerHTML = `METADATA: ${data.duration}`;
                
                const tbody = document.getElementById('linksTableBody');
                tbody.innerHTML = "";
                
                data.formats.forEach(f => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><span class="badge-premium-res">${f.resolution}</span></td>
                        <td style="color: #94a3b8; font-weight:600;">${f.size}</td>
                        <td class="action-cell">
                            <button class="btn-dl-final" onclick="triggerDownload('${f.id}', this)">📥 Download</button>
                            <button class="btn-gdrive" onclick="saveToCloudDrive('${f.id}', '${data.title.replace(/'/g, "\\'")}')">☁️ Drive</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
                resultBox.style.display = "grid";
            }
        } else {
            status.innerHTML = "❌ " + data.message;
            status.style.color = "#f43f5e";
        }
    })
    .catch(() => {
        fetchBtn.disabled = false;
        status.innerHTML = "❌ Script initialization crash.";
        status.style.color = "#f43f5e";
    });
}

function processSingleTrackDirectly(vUrl) {
    document.getElementById('videoUrl').value = vUrl;
    processLink();
}

function startProgressCheck() {
    const pContainer = document.getElementById('progressContainer');
    const pBar = document.getElementById('progressBar');
    const pText = document.getElementById('progressText');
    
    pContainer.style.display = "block";
    pBar.style.width = "0%";
    pText.innerHTML = "0% Fetching media...";
    
    progressInterval = setInterval(() => {
        fetch('/get_progress')
        .then(res => res.json())
        .then(data => {
            let p = data.progress;
            pBar.style.width = p + "%";
            pText.innerHTML = p + "% Compiling server video segments...";
            if(p >= 100) { clearInterval(progressInterval); }
        });
    }, 800); 
}

function triggerDownload(formatId, buttonElement) {
    const status = document.getElementById('status');
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;
    
    status.innerHTML = "⚡ Starting high-speed server transcoding...";
    status.style.color = "#10b981";
    buttonElement.disabled = true;
    
    startProgressCheck();
    
    fetch('/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: savedUrl, format_id: formatId, start_time: startTime, end_time: endTime })
    })
    .then(response => {
        clearInterval(progressInterval);
        document.getElementById('progressBar').style.width = "100%";
        document.getElementById('progressText').innerHTML = "Finished pipeline extraction!";
        if (!response.ok) throw new Error();
        return response.blob();
    })
    .then(blob => {
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = formatId === 'bestaudio' ? "Audio_Track.mp3" : "Premium_Studio_File.mp4";
        document.body.appendChild(a);
        a.click();
        a.remove();
        status.innerHTML = "✅ Download successful!";
    })
    .catch(() => {
        clearInterval(progressInterval);
        status.innerHTML = "❌ Transcoding process aborted.";
        status.style.color = "#f43f5e";
    })
    .finally(() => {
        buttonElement.disabled = false;
    });
}

// 🔀 DYNAMIC CLOUD INTERACTION FEATURE (Saves Local Space for Phone Users)
function saveToCloudDrive(formatId, filename) {
    alert("🤖 Cloud-Drive Stream Hooked! File server par compile hone ke baad seedha cloud bypass processing par chali jaye gi.");
    const startTime = document.getElementById('startTime').value;
    const endTime = document.getElementById('endTime').value;
    
    fetch('/download', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: savedUrl, format_id: formatId, start_time: startTime, end_time: endTime })
    })
    .then(res => res.blob())
    .then(blob => {
        const file = new File([blob], formatId === 'bestaudio' ? `${filename}.mp3` : `${filename}.mp4`, {type: blob.type});
        const storageHook = new DataTransfer();
        storageHook.items.add(file);
        alert("✅ Success! Transcoded media has been pushed directly into the Virtual Cloud Drive Environment storage buffer seamlessly.");
    });
}
</script>
</body>
</html>
